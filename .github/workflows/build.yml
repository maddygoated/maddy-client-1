name: Build Maddy's Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maddys-client-1.21.11-source/maddys-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: maddys-client-jar
          path: maddys-client-1.21.11-source/maddys-client/build/libs/maddys-client-1.0.0.jar
